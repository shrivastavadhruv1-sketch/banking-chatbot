version: '3.8'

services:
  # Banking Chatbot Application
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking-chatbot
    ports:
      - "5000:5000"
    environment:
      DEBUG: "False"
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-secure-key}
      DATABASE_PATH: /app/database/banking.db
      LOG_FILE: /app/logs/app.log
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chatbot-network

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: banking-chatbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
    depends_on:
      - chatbot
    restart: unless-stopped
    networks:
      - chatbot-network

networks:
  chatbot-network:
    driver: bridge

volumes:
  chatbot_db:
  chatbot_logs:
